[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-morphogenetic-nca"
version = "0.1.0"
description = "Reproducible Growing NCA and EngramNCA baselines for latent morphogenetic-state experiments."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
analysis = ["scikit-learn>=1.4", "scipy>=1.10"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
