name: experiment_1
checkpoint: checkpoints/growing/gecko/model.pt
target: data/gecko.png
output_dir: reports/experiment_1/gecko
device: auto

model:
  channels: 16
  hidden_size: 128
  target_size: 40
  target_padding: 16
  update_probability: 0.5
  alpha_threshold: 0.1

calibration:
  replicates: 32
  seed_start: 10000
  mature_start: 64
  mature_stop: 96
  acceptance_quantile: 0.95

evaluation:
  replicates: 30
  seed_start: 20000
  continuation_seed_offset: 1000000
  horizon: 10000
  attainment_patience: 5
  failure_patience: 10

interventions:
  include_standard_conditions: true
  include_morphology_freeze: true
  partial_freeze_counts: [6]
  restore_strengths: [0.1]
  periodic_reset_intervals: [150]
  development_reference_steps: [16]
  development_restore_strengths: [0.1]
  development_reset_intervals: [150]

analysis:
  hidden_channel_record_every: 10
  visible_channel_record_every: 10
  snapshot_steps: [0, 100, 500, 1000, 2000, 5000, 10000]
