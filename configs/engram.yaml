name: engram
model: engram
channels: 16
gene_size: 8
gene_hidden_size: 64
gene_prop_hidden_size: 128
primitive_set: body_parts
primitive_size: 30
primitive_padding: 5
morphology_size: 60
morphology_padding: 5
update_probability: 0.5
train_steps_min: 32
train_steps_max: 92
gene_pool_size: 256
prop_pool_size: 1000
batch_size: 12
gene_training_iterations: 15000
prop_training_iterations: 14000
optimizer: adamw
learning_rate: 0.001
lr_step_size: 5000
lr_gamma: 0.3
perception_loss_weight: 0.1
